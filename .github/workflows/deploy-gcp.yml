name: Deploy to GCP

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GCP_REGION }}
  IMAGE_NAME: eko
  VM_NAME: ${{ secrets.GCP_VM }}
  VM_ZONE: ${{ secrets.GCP_ZONE }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build Docker image
        run: |
          docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/eko-repo/${{ env.IMAGE_NAME }}:${{ github.sha }} .
          docker tag ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/eko-repo/${{ env.IMAGE_NAME }}:${{ github.sha }} \
                     ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/eko-repo/${{ env.IMAGE_NAME }}:latest

      - name: Push to Artifact Registry
        run: |
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/eko-repo/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/eko-repo/${{ env.IMAGE_NAME }}:latest

      - name: Deploy to VM
        run: |
          # Try to update container directly (fastest method)
          gcloud compute instances update-container ${{ env.VM_NAME }} \
            --zone=${{ env.VM_ZONE }} \
            --container-image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/eko-repo/${{ env.IMAGE_NAME }}:latest \
            --container-restart-policy=always \
            || {
              # Fallback: SSH and run startup script
              echo "Direct container update failed, using startup script..."
              gcloud compute ssh ${{ env.VM_NAME }} --zone=${{ env.VM_ZONE }} --command="sudo bash -c 'cd /tmp && curl -s http://metadata.google.internal/computeMetadata/v1/instance/attributes/startup-script -H Metadata-Flavor:Google | bash'"
            }

      - name: Verify deployment
        run: |
          EXTERNAL_IP=$(gcloud compute instances describe ${{ env.VM_NAME }} \
            --zone=${{ env.VM_ZONE }} \
            --format='get(networkInterfaces[0].accessConfigs[0].natIP)')

          echo "Deployment complete!"
          echo "Application URL: http://$EXTERNAL_IP:8080"
          echo "Testing health endpoint..."

          # Wait for application to be ready
          sleep 10

          # Health check with retry
          for i in {1..5}; do
            if curl -f http://$EXTERNAL_IP:8080/health; then
              echo "✅ Health check passed!"
              exit 0
            else
              echo "Health check attempt $i failed, retrying..."
              sleep 5
            fi
          done

          echo "❌ Health check failed after 5 attempts"
          exit 1
