services:
  eko:
    build:
      context: .
      dockerfile: Dockerfile
      # Use BuildKit for better caching and parallel builds
      args:
        - BUILDKIT_INLINE_CACHE=1

    # Image name (used after building or when pulling pre-built image)
    image: openray/eko:latest

    # Container name for easier management
    container_name: eko

    ports:
      - "8080:8080"

    # ========================================================================
    # Volume Mounts - Configuration and Data
    #
    # IMPORTANT: Before starting, ensure you have:
    #   1. Created config.yaml from the example:
    #      cp configs/config.example.yaml configs/config.yaml
    #   2. Created necessary directories:
    #      mkdir -p reports patterns/custom
    # ========================================================================
    volumes:
      # Config file (required) - mounted as read-only for security
      # Create from: cp configs/config.example.yaml configs/config.yaml
      - ./configs/config.yaml:/app/configs/config.yaml:ro

      # Custom patterns directory (optional override)
      # Add your custom detection patterns here to extend defaults
      - ./patterns/custom:/app/patterns/custom:ro

      # Reports directory (persistent storage for compliance reports)
      # Only writable mount - application generates reports here
      - ./reports:/app/reports:rw
    environment:
      # Config file location (default, can be overridden)
      - EKO_CONFIG=/app/configs/config.yaml

      # Optional: Override specific config values via environment
      # Uncomment and adjust as needed:
      # - EKO_LOG_LEVEL=info
      # - EKO_PORT=8080

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8080/health",
        ]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

    deploy:
      resources:
        limits:
          cpus: "1.0" # Maximum 1 CPU core
          memory: 512M # Maximum 512MB RAM
        reservations:
          cpus: "0.25" # Minimum 0.25 CPU core
          memory: 128M # Minimum 128MB RAM

    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "10m" # Maximum 10MB per log file
        max-file: "3" # Keep 3 log files (30MB total)

    networks:
      - eko-network

    # The slm-sidecar dependency is soft-required: when proxy.slm.enabled is
    # false (default), the sidecar service can be omitted entirely. When
    # enabled, Ekō waits for the sidecar's /healthz to return 200 before
    # serving traffic.
    depends_on:
      slm-sidecar:
        condition: service_healthy
        required: false

  # ========================================================================
  # Optional SLM sidecar (Phase 3 contextual detection)
  #
  # Loads `openai/privacy-filter` + `iamSamurai/privacy-filter-nigeria` and
  # exposes /predict + /predict_batch over HTTP/JSON. Only needed when
  # `proxy.slm.enabled: true` in configs/config.yaml. See slm-sidecar/README.md.
  # First boot pulls the model from Hugging Face; expect 60-120s before the
  # health check goes green.
  # ========================================================================
  slm-sidecar:
    # Behind the "slm" profile so default `docker compose up` doesn't pull the
    # ~2 GB torch+transformers image. Operators who set proxy.slm.enabled: true
    # in configs/config.yaml run `docker compose --profile slm up`.
    profiles: ["slm"]

    build:
      context: ./slm-sidecar
      dockerfile: Dockerfile
    image: openray/eko-slm-sidecar:latest
    container_name: eko-slm-sidecar

    environment:
      - PRIVACY_FILTER_MODEL_NAME=openai/privacy-filter
      - PRIVACY_FILTER_ADAPTER_NAME=iamSamurai/privacy-filter-nigeria
      - PRIVACY_FILTER_DEVICE=cpu
      # Hugging Face cache; persist across restarts to avoid re-downloading.
      - HF_HOME=/root/.cache/huggingface
      # Optional Hugging Face token. Unauthenticated requests are heavily
      # rate-limited, which can stall the first model download. Put
      # `HF_TOKEN=hf_...` in your local .env (gitignored) or `export` it in
      # your shell before running `docker compose --profile slm up`. If
      # unset, the sidecar will try anonymous downloads and may be slow.
      - HF_TOKEN=${HF_TOKEN:-}
      # Make HF download progress visible in `docker logs` / attached output
      # by promoting hub log level and disabling tqdm (which self-suppresses
      # without a TTY). xet still logs to /root/.cache/huggingface/xet/logs/
      # because it's a separate Rust binary; tail those for chunk-level detail.
      - HF_HUB_VERBOSITY=info
      - HF_HUB_DISABLE_PROGRESS_BARS=1

    volumes:
      - hf-cache:/root/.cache/huggingface

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request, sys; r = urllib.request.urlopen('http://localhost:8000/healthz'); sys.exit(0 if r.status == 200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 5

    deploy:
      resources:
        limits:
          memory: 4G

    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - eko-network

networks:
  eko-network:
    driver: bridge
    name: eko-network

volumes:
  hf-cache:
    name: eko-hf-cache
