services:
  eko:
    build:
      context: .
      dockerfile: Dockerfile
      # Use BuildKit for better caching and parallel builds
      args:
        - BUILDKIT_INLINE_CACHE=1

    # Image name (used after building or when pulling pre-built image)
    image: openray/eko:latest

    # Container name for easier management
    container_name: eko

    ports:
      - "8080:8080"

    # ========================================================================
    # Volume Mounts - Configuration and Data
    #
    # IMPORTANT: Before starting, ensure you have:
    #   1. Created config.yaml from the example:
    #      cp configs/config.example.yaml configs/config.yaml
    #   2. Created necessary directories:
    #      mkdir -p reports patterns/custom
    # ========================================================================
    volumes:
      # Config file (required) - mounted as read-only for security
      # Create from: cp configs/config.example.yaml configs/config.yaml
      - ./configs/config.yaml:/app/configs/config.yaml:ro

      # Custom patterns directory (optional override)
      # Add your custom detection patterns here to extend defaults
      - ./patterns/custom:/app/patterns/custom:ro

      # Reports directory (persistent storage for compliance reports)
      # Only writable mount - application generates reports here
      - ./reports:/app/reports:rw
    environment:
      # Config file location (default, can be overridden)
      - EKO_CONFIG=/app/configs/config.yaml

      # Optional: Override specific config values via environment
      # Uncomment and adjust as needed:
      # - EKO_LOG_LEVEL=info
      # - EKO_PORT=8080

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8080/health",
        ]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

    deploy:
      resources:
        limits:
          cpus: "1.0" # Maximum 1 CPU core
          memory: 512M # Maximum 512MB RAM
        reservations:
          cpus: "0.25" # Minimum 0.25 CPU core
          memory: 128M # Minimum 128MB RAM

    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "10m" # Maximum 10MB per log file
        max-file: "3" # Keep 3 log files (30MB total)

    networks:
      - eko-network

networks:
  eko-network:
    driver: bridge
    name: eko-network
