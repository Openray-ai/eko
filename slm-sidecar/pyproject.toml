[project]
name = "eko-slm-sidecar"
version = "0.1.0"
description = "Ekō SLM sidecar — contextual PII detection via openai/privacy-filter + iamSamurai/privacy-filter-nigeria"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "transformers>=4.46",
    "peft>=0.13",
    "torch>=2.4",
    "safetensors>=0.4",
    "accelerate>=1.0",
    "huggingface-hub>=0.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
