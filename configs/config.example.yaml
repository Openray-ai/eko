server:
  port: "8080"
  host: "0.0.0.0"

# Logging configuration
logging:
  level: "info"        # Options: debug, info, warn, error, fatal
  format: "text"       # Options: text, json
  colorize: true       # Enable colored output (recommended for development)
  output_file: ""      # Optional: path to log file (empty for stdout)

# Proxy configuration for AI providers
proxy:
  openai:
    enabled: true
    base_url: "https://api.openai.com/v1"
    timeout: 30

  anthropic:
    enabled: true
    base_url: "https://api.anthropic.com/v1"
    timeout: 30

  gemini:
    enabled: true
    base_url: "https://generativelanguage.googleapis.com/v1"
    timeout: 30

  deepseek:
    enabled: true
    base_url: "https://api.deepseek.com/v1"
    timeout: 30

  # Model routing keeps the public API OpenAI-compatible while selecting the
  # correct upstream provider from the requested model name. Exact model
  # matches win over prefixes; prefixes win over the default provider.
  model_routing:
    default_provider: "openai"
    models: {}
    prefixes:
      "gpt-": "openai"
      "o": "openai"
      "claude-": "anthropic"
      "gemini-": "gemini"
      "deepseek-": "deepseek"

  behavior:
    on_violation: "sanitize"  # Options: block, sanitize, warn
    log_requests: true
    add_violation_headers: true
    sanitization_mode: "tokenize"  # Options: redact, tokenize
    token_store_backend: "memory"  # Options: memory, redis
    token_ttl_ms: 30000            # Token vault TTL in ms (tokenize mode only)

  redis:
    addr: "127.0.0.1:6379"
    username: ""
    password: ""
    db: 0
    key_prefix: "eko:"
    meta_suffix: "vault_meta:"
    payload_suffix: "vault_payload:"
    pool_size: 10
    min_idle_conns: 2
    dial_timeout_ms: 100
    read_timeout_ms: 100
    write_timeout_ms: 100
    max_retries: 3

  # Optional Small Language Model contextual detector. When enabled, Ekō calls
  # the slm-sidecar service in parallel with regex matching and merges results
  # through the same redaction/tokenization pipeline. See slm-sidecar/README.md.
  slm:
    enabled: false
    endpoint: "http://slm-sidecar:8000"
    timeout_ms: 800
    max_input_bytes: 16384       # skip SLM call for inputs larger than this
    breaker:
      failure_threshold: 5       # consecutive failures before tripping
      cooldown_ms: 30000         # how long to skip SLM after tripping
    # Optional per-label overrides. Empty fields fall back to defaults.
    # See internal/core/slm/mapping.go for the full default table.
    # labels:
    #   private_phone: { severity: "BLOCK" }
    #   private_url:   { severity: "WARN" }

  crypto:
    provider: "local"            # Options: local, vault-transit
    active_key_id: "local-dev"
    # Base64-encoded 32-byte AES key; required for the Redis backend.
    # SECURITY: do not commit a real key here. Inject via secrets manager
    # (e.g. Kubernetes Secret, AWS Secrets Manager) at deploy time.
    local_master_key: ""
    # Optional fallback keys to allow decrypting payloads sealed with a prior
    # active_key_id. To rotate: add the current key here, then change
    # active_key_id + local_master_key to the new pair. Remove the fallback
    # entry once the session TTL has elapsed for all live sessions.
    # Example: [{key_id: "local-dev", master_key: "BASE64_PREVIOUS_KEY"}]
    fallback_keys: []
    vault_transit:
      address: "https://vault.example.com"
      token: ""                  # SECURITY: inject at deploy time, do not commit
      namespace: ""
      mount: "transit"
      key_name: "eko-session"
      timeout_ms: 2000
      tls_skip_verify: false     # Leave false in production

# Pattern management
patterns:
  config_file: "./patterns/default/patterns.yaml"
  custom_patterns_dir: "./patterns/custom"

# Alerting configuration
alerts:
  webhooks:
    - url: "https://hooks.slack.com/services/YOUR/WEBHOOK"
      severity: ["BLOCK"]
  email:
    smtp_host: "smtp.gmail.com"
    smtp_port: 587
    from: "alerts@company.com"
    to: ["security@company.com"]

# Compliance reporting
compliance:
  enable_reporting: true
  report_dir: "./reports"
  retention_days: 90

  allowed_origins: ["http://localhost:3000","http://localhost:3001", "http://localhost:8080", "https://eko.openray.ai"]
